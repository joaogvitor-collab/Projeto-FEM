<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Feminismo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>
<body class="pagina-login">
    <div class="conteiner login">
        <div>
            <a href="./index.html" class="botao-claro">Voltar</a>
        </div>

        <form id="formulario">
            <div class="campo">
                    <label for="nome">Seu nome:</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                        minlength="2">
                </div>

                <div class="campo">
                    <label for="email">Seu e-mail:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemplo@email.com"
                        required>
                </div>

                <div class="campo">
                    <label for="nivel">Você já conhece o feminismo?</label>
                    <select id="nivel" name="nivel" required>
                        <option value="">Selecione uma opção</option>
                        <option value="nenhum">Ainda não conheço</option>
                        <option value="basico">Conheço alguns conceitos</option>
                        <option value="intermediario">Tenho conhecimento intermediário</option>
                        <option value="avancado">Tenho conhecimento avançado</option>
                    </select>
                </div>

                <div class="botoes">
                    <button type="submit" class="botao">Enviar respostas</button>
                    <button type="reset" class="botao botao-secundario">Limpar formulário</button>
                </div>
        </form>
    </div>
    <script src="script-login.js" defer></script>
</body>
</html>
